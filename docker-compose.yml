services:
  postgres:
    image: postgres:16-alpine
    container_name: ripple-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-ripple}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ripple}
      POSTGRES_DB: ${DATABASE_NAME:-ripple}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ripple} -d ${DATABASE_NAME:-ripple}"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulation-engine:
    build:
      context: ./apps/simulation-engine
      dockerfile: Dockerfile
    container_name: ripple-simulation-engine
    restart: unless-stopped
    environment:
      SIMULATION_HOST: 0.0.0.0
      SIMULATION_PORT: 8000
    ports:
      - "${SIMULATION_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ripple-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-ripple}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ripple}
      DATABASE_NAME: ${DATABASE_NAME:-ripple}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SIMULATION_ENGINE_URL: http://simulation-engine:8000
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ripple_token}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      simulation-engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: ripple-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
